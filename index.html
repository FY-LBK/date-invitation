  <title>巴库邀请库洛米去约会</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">
  <style>
    :root {
      --pink:#ff6eaa; --pink-deep:#e44791; --lavender:#b991f3;
      --ink:#60466d; --muted:#9b7d9e; --paper:#fffafd;
      --line:#f1d6e7; --danger:#d94e7f;
      --shadow:0 18px 46px rgba(132,79,145,.18);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { min-height:100%; background:#f7dff3; scroll-behavior:smooth; }
    body {
      margin:0; min-height:100dvh; overflow-x:hidden; overscroll-behavior-y:contain;
      color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
      background:
        radial-gradient(circle at 10% 9%,rgba(255,255,255,.75) 0 3px,transparent 4px),
        radial-gradient(circle at 88% 16%,rgba(255,255,255,.7) 0 3px,transparent 4px),
        linear-gradient(145deg,#ffd9eb 0%,#f2d5f4 45%,#ddd0ff 100%);
      background-size:150px 150px,210px 210px,auto;
    }
    button,input,select,textarea { font:inherit; font-size:16px; }
    button { border:0; cursor:pointer; touch-action:manipulation; }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:4px solid rgba(255,110,170,.25); outline-offset:3px; }
    .page-shell {
      min-height:100dvh; display:flex; justify-content:center; align-items:flex-start;
      padding:max(12px,env(safe-area-inset-top)) 10px max(34px,env(safe-area-inset-bottom));
      position:relative;
    }
    .decor { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
    .decor span { position:absolute; color:rgba(255,255,255,.86); animation:float 5.5s ease-in-out infinite; }
    .d1{left:5%;top:13%;font-size:28px} .d2{right:7%;top:17%;font-size:24px;animation-delay:-2s}
    .d3{left:8%;bottom:12%;font-size:25px;animation-delay:-3s} .d4{right:8%;bottom:13%;font-size:30px}
    .app-card {
      width:min(100%,680px); position:relative; z-index:1; overflow:hidden;
      background:rgba(255,255,255,.95); border:3px solid rgba(255,132,181,.58);
      border-radius:28px; box-shadow:var(--shadow); padding:22px 18px 28px; text-align:center;
    }
    .app-card::before,.app-card::after { content:"✿"; position:absolute; color:#ffb1d0; font-size:25px; opacity:.7; }
    .app-card::before{left:14px;top:10px} .app-card::after{right:14px;bottom:10px}
    .progress { display:flex; justify-content:center; gap:8px; margin:0 0 20px; }
    .progress i { width:8px;height:8px;border-radius:50%;background:#efdce8;transition:.25s; }
    .progress i.active { width:30px;border-radius:10px;background:linear-gradient(90deg,var(--pink),var(--lavender)); }
    .screen { display:none; animation:fadeIn .28s ease both; }
    .screen.active { display:block; }
    h1,h2 { color:#744e79; line-height:1.32; }
    h1 { font-size:clamp(27px,7vw,38px); margin:17px 0 10px; }
    h2 { font-size:clamp(24px,6vw,32px); margin:15px 0 22px; }
    p { margin:0; line-height:1.75; }
    .subtle { color:var(--muted); font-size:14px; }
    .cover-card {
      width:min(100%,540px); margin:0 auto; padding:14px; border-radius:25px;
      background:linear-gradient(135deg,#ffe5f1,#f1e5ff); box-shadow:0 14px 30px rgba(126,82,143,.16);
    }
    .cover-label {
      width:max-content; max-width:100%; margin:0 0 10px; padding:7px 12px; border-radius:999px;
      background:rgba(255,255,255,.88); color:#8c6290; font-size:13px; font-weight:700;
    }
    .cover-image { width:100%; max-height:55dvh; object-fit:contain; display:block; border-radius:18px; background:#fdeaf3; }
    .cover-copy { text-align:left; padding:13px 3px 2px; }
    .cover-copy h3 { margin:0 0 7px; font-size:clamp(22px,5.6vw,30px); color:#794f7f; }
    .cover-copy p { color:#98779c; font-size:14px; }
    .character-card {
      width:min(100%,410px); margin:3px auto 14px; padding:10px; border-radius:25px;
      background:linear-gradient(145deg,#ffe8f3,#eee4ff); box-shadow:0 12px 28px rgba(135,86,151,.14);
    }
    .character-card img { width:100%; max-height:43dvh; object-fit:contain; display:block; border-radius:18px; }
    .actions { display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; margin:24px 0 15px; }
    .btn { min-height:50px; padding:12px 26px; border-radius:999px; font-weight:700; transition:transform .12s,box-shadow .2s,opacity .2s; }
    .btn:active { transform:scale(.96); }
    .btn-primary { color:#fff; background:linear-gradient(135deg,var(--pink),var(--pink-deep)); box-shadow:0 9px 19px rgba(228,71,145,.24); }
    .btn-secondary { color:#846f88; background:#f0ebf1; }
    .btn-ghost { color:#a2638b; background:#fff5fa; border:2px solid #f0d6e5; }
    .btn[disabled] { opacity:.55; cursor:not-allowed; }
    .full { width:min(100%,490px); }
    .avoid-area { position:relative; min-height:52px; flex:0 0 115px; }
    #noBtn { position:absolute; left:0; top:0; transition:left .22s,top .22s; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; width:min(100%,500px); margin:0 auto 18px; text-align:left; }
    .field.full-field { grid-column:1/-1; }
    .field label { display:block; font-weight:700; margin:0 0 7px 4px; font-size:14px; }
    .field input,.field select,.field textarea { width:100%; border:2px solid var(--line); border-radius:15px; color:var(--ink); background:#fffafd; }
    .field input,.field select { height:52px; padding:0 13px; }
    .field textarea { min-height:86px; padding:12px 13px; resize:vertical; }
    .field input:focus,.field select:focus,.field textarea:focus { border-color:var(--pink); }
    .food-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(100%,510px); margin:0 auto 14px; }
    .food { min-height:54px; padding:10px 7px; color:var(--ink); background:#fff5fa; border:2px solid #f3dce8; border-radius:17px; font-weight:700; }
    .food.selected { color:#fff; background:linear-gradient(135deg,#ff84b6,#a983eb); border-color:transparent; }
    .food.selected::after { content:" ✓"; }
    .other-food { width:min(100%,510px); margin:0 auto 5px; display:none; }
    .other-food.visible { display:block; }
    .hint { min-height:22px; margin:8px 0 0; color:var(--muted); font-size:13px; }
    .error { color:var(--danger); font-weight:700; }
    .summary { width:min(100%,470px); margin:18px auto; padding:19px; border:2px dashed #efb4d0; border-radius:20px; background:#fff8fc; text-align:left; }
    .summary-row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid #f4deea; }
    .summary-row:last-child { border-bottom:0; }
    .summary-row strong { color:#b45d8e; white-space:nowrap; }
    .summary-row span { text-align:right; font-weight:700; word-break:break-word; }
    .privacy { width:min(100%,490px); margin:10px auto 0; color:#a087a1; font-size:12px; line-height:1.55; }
    .status { min-height:25px; margin-top:10px; font-size:14px; font-weight:700; }
    .status.success { color:#5f9b72; } .status.failure { color:var(--danger); }
    .success-box { display:none; width:min(100%,490px); margin:15px auto 0; padding:15px; border-radius:17px; background:#f2fff7; border:2px solid #ccebd8; color:#538565; }
    .success-box.visible { display:block; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    @keyframes float { 0%,100%{translate:0 0} 50%{translate:0 -10px} }
    @media (max-width:560px) {
      .app-card{padding:21px 15px 26px;border-radius:25px}
      .form-grid{grid-template-columns:1fr;gap:12px}
      .field.full-field{grid-column:auto}
      .food-grid{grid-template-columns:repeat(2,1fr)}
      .cover-image{max-height:52dvh}
      .character-card img{max-height:38dvh}
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important} }
  </style>
</head>

        <h2>约会安排确认</h2>
        <div class="summary">
          <div class="summary-row"><strong>称呼</strong><span id="summaryNickname">—</span></div>
          <div class="summary-row"><strong>日期</strong><span id="summaryDate">—</span></div>
          <div class="summary-row"><strong>时间</strong><span id="summaryTime">—</span></div>
          <div class="summary-row"><strong>餐饮</strong><span id="summaryFood">—</span></div>
        </div>
        <div class="field full-field" style="width:min(100%,490px);margin:0 auto;text-align:left"><label for="noteInput">想对巴库说的话（可不填）</label><textarea id="noteInput" maxlength="200" placeholder="例如：记得准时来接我哦"></textarea></div>
        <div class="actions">
          <button class="btn btn-ghost" data-back="4" type="button">返回修改</button>
          <button class="btn btn-primary" id="submitBtn" type="button">确认并发送给巴库</button>
        </div>
        <button class="btn btn-secondary full" id="copyBtn" type="button">复制约会安排</button>
        <p class="privacy">提交后会把称呼、日期、时间、餐饮和留言发送到邀请人的接收表，仅用于确认本次约会。</p>
        <p class="status" id="submitStatus" aria-live="polite"></p>
        <div class="success-box" id="successBox">已经发送成功啦！巴库会看到你的选择 ♡</div>
      </section>
    </section>
  </main>

  <script>
    (() => {
      // 部署 Google Apps Script 后，只需要把下面这一行替换成你的 /exec 地址。
      const DATA_ENDPOINT = 'PASTE_APPS_SCRIPT_WEB_APP_URL_HERE';
      const INVITATION_ID = 'baku-kuromi-date-v2';
      const screens = [...document.querySelectorAll('.screen')];
      const dots = [...document.querySelectorAll('.progress i')];
      const state = {
        submissionId: (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2)),
        accepted: false, nickname: '', date: '', time: '', foods: [], otherFood: '', note: ''
      };
      const $ = id => document.getElementById(id);
      const configured = () => /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(DATA_ENDPOINT);

      function showStep(step) {
        screens.forEach((el,i) => el.classList.toggle('active', i === step-1));
        dots.forEach((el,i) => el.classList.toggle('active', i === step-1));
        requestAnimationFrame(() => window.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}));
      }
      function saveState() {
        try { localStorage.setItem('baku-kuromi-date-state', JSON.stringify({...state, note:$('noteInput').value})); } catch (_) {}
      }
      function restoreState() {
        try {
          const saved = JSON.parse(localStorage.getItem('baku-kuromi-date-state') || 'null');
          if (!saved) return;
          Object.assign(state, saved);
          $('nicknameInput').value = state.nickname || '';
          $('dateInput').value = state.date || $('dateInput').value;
          $('timeInput').value = state.time || '';
          $('otherFoodInput').value = state.otherFood || '';
          $('noteInput').value = state.note || '';
          document.querySelectorAll('.food').forEach(btn => btn.classList.toggle('selected', state.foods.includes(btn.dataset.food)));
          $('otherFoodWrap').classList.toggle('visible', state.foods.includes('其他'));
        } catch (_) {}
      }
      function payload(eventType) {
        return {
          event: eventType,
          invitation_id: INVITATION_ID,
          submission_id: state.submissionId,
          accepted: String(state.accepted),
          nickname: state.nickname,
          date: state.date,
          time: state.time,
          foods: [...state.foods.filter(x => x !== '其他'), ...(state.otherFood ? [state.otherFood] : [])].join('、'),
          note: state.note,
          client_time: new Date().toISOString(),
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
          page_url: location.href,
          user_agent: navigator.userAgent
        };
      }
      async function sendEvent(eventType) {
        if (!configured()) throw new Error('接收服务尚未配置');
        const body = new URLSearchParams(payload(eventType));
        await fetch(DATA_ENDPOINT, { method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'}, body });
      }
      function updateSummary() {
        const foods = [...state.foods.filter(x => x !== '其他'), ...(state.otherFood ? [state.otherFood] : [])];
        $('summaryNickname').textContent = state.nickname || '未填写';
        $('summaryDate').textContent = state.date || '—';
        $('summaryTime').textContent = state.time || '—';
        $('summaryFood').textContent = foods.join('、') || '—';
      }
      function copyText() {
        const foods = [...state.foods.filter(x => x !== '其他'), ...(state.otherFood ? [state.otherFood] : [])].join('、');
        return `约会已经确认啦！
称呼：${state.nickname || '未填写'}
日期：${state.date}
时间：${state.time}
餐饮：${foods}${state.note ? `
留言：${state.note}` : ''}`;
      }

      const today = new Date();
      const pad = n => String(n).padStart(2,'0');
      const todayString = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
      $('dateInput').min = todayString;
      $('dateInput').value = todayString;
      restoreState();

      $('yesBtn').addEventListener('click', () => {
        state.accepted = true; saveState(); showStep(2);
        sendEvent('accepted').catch(() => {});
      });
      $('nextBtn').addEventListener('click', () => showStep(3));
      document.querySelectorAll('[data-back]').forEach(btn => btn.addEventListener('click', () => showStep(Number(btn.dataset.back))));

      const avoidArea = $('avoidArea'), noBtn = $('noBtn');
      function dodge(e) {
        if (e?.cancelable && e.type === 'touchstart') e.preventDefault();
        const maxX = Math.max(0, avoidArea.clientWidth-noBtn.offsetWidth);
        const maxY = Math.max(0, avoidArea.clientHeight-noBtn.offsetHeight);
        noBtn.style.left = Math.round(Math.random()*maxX)+'px';
        noBtn.style.top = Math.round(Math.random()*maxY)+'px';
      }
      ['mouseenter','touchstart','focus','click'].forEach(name => noBtn.addEventListener(name,dodge,{passive:false}));

      $('confirmTime').addEventListener('click', () => {
        const date = $('dateInput').value, time = $('timeInput').value;
        if (!date || !time) { $('dateHint').textContent='请把日期和时间都选好哦 ♡'; $('dateHint').className='hint error'; return; }
        state.date=date; state.time=time; state.nickname=$('nicknameInput').value.trim();
        $('dateHint').textContent=''; $('dateHint').className='hint'; saveState(); showStep(4);
      });

      document.querySelectorAll('.food').forEach(btn => btn.addEventListener('click', () => {
        btn.classList.toggle('selected');
        state.foods = [...document.querySelectorAll('.food.selected')].map(x=>x.dataset.food);
        $('otherFoodWrap').classList.toggle('visible', state.foods.includes('其他'));
        $('foodHint').textContent = state.foods.length ? `已选择 ${state.foods.length} 项，可以继续选择。` : '至少选一样，就可以继续啦。';
        $('foodHint').className='hint'; saveState();
      }));
      $('confirmFood').addEventListener('click', () => {
        state.foods = [...document.querySelectorAll('.food.selected')].map(x=>x.dataset.food);
        state.otherFood = $('otherFoodInput').value.trim();
        if (!state.foods.length) { $('foodHint').textContent='请至少选择一样哦 ♡'; $('foodHint').className='hint error'; return; }
        if (state.foods.includes('其他') && !state.otherFood) { $('foodHint').textContent='选择“其他”后，请写下想吃的内容。'; $('foodHint').className='hint error'; return; }
        saveState(); updateSummary(); showStep(5);
      });

      $('copyBtn').addEventListener('click', async () => {
        state.note=$('noteInput').value.trim(); saveState();
        try { await navigator.clipboard.writeText(copyText()); $('submitStatus').textContent='约会安排已复制，可以直接发到微信。'; $('submitStatus').className='status success'; }
        catch (_) { $('submitStatus').textContent='复制失败，请长按确认卡片手动复制。'; $('submitStatus').className='status failure'; }
      });

      $('submitBtn').addEventListener('click', async () => {
        state.note=$('noteInput').value.trim(); saveState();
        const btn=$('submitBtn'), status=$('submitStatus');
        btn.disabled=true; btn.textContent='正在发送…'; status.textContent=''; status.className='status';
        try {
          await sendEvent('confirmed');
          status.textContent='发送成功'; status.className='status success';
          $('successBox').classList.add('visible'); btn.textContent='已经发送';
        } catch (err) {
          status.textContent = configured() ? '暂时发送失败，请检查网络后重试，或先复制约会安排。' : '还没有连接数据接收服务，请先配置 Apps Script 地址。';
          status.className='status failure'; btn.disabled=false; btn.textContent='重新发送';
        }
      });
    })();
  </script>
</body>
</html>
